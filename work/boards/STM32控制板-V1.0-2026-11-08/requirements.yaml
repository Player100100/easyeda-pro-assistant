# 要求基线 — STM32控制板（Board1）
# 生成日期 2026-11-08。来源标注：
#   explicit  = 器件手册/标准/板厂规则/用户明确给出
#   inferred  = 从设计推断，只作检查假设
#   missing   = 无依据，相关项只能 REVIEW / NOT_CHECKED
# 手册依据说明：本轮 WebFetch 被拦，datasheet 事实来自检索结果引述（标「手册引述（检索）」），
# 未直接打开 PDF 原文；引用条款号需人工复核。

requirements:
  # ---------- A 类：数据一致性 ----------
  - id: REQ-A01-001
    check: A-01
    object: 快照
    requirement: "快照含编辑器版本、工程 UUID、文档数、图元数；文件可解析"
    source: "review-method.md §2"
    conditions: "2026-11-08 采集"
    status: explicit
    evidence: "pcb_raw.json / sch_*_raw.json / sch.net / pcb.net，SHA256 见 source.md"
    note: "无 .epro2 原始包，A-01 的包完整性不适用；以 API 快照代替"

  - id: REQ-A03-001
    check: A-03
    object: 离线网表 vs API 网表
    requirement: "逐引脚映射及成员分组一致；别名/过滤对象/导出范围差异逐项解释"
    source: "review-method.md A-03"
    conditions: "需 `.epro2` 离线包"
    status: missing
    evidence: "无 `.epro2` 离线包，未执行；本轮做的是 sch.net vs pcb.net（属 A-05）"
    note: "A-03 = NOT_CHECKED；不得用 A-05 的结果顶替"

  - id: REQ-A05-001
    check: A-05
    object: 原理图↔PCB
    requirement: "逐引脚映射一致；独有/缺失引脚逐条解释"
    source: "review-method.md A-05"
    conditions: "同一工程的 sch.net 与 pcb.net（均为 API 导出）"
    status: explicit
    evidence: "79 元件 / 306 共有引脚 / 69 网 / 0 个仅在单侧的引脚 / 0 个网名或成员不一致"
    note: "这是本板唯一一次完整的双平面网表比对；A-03（离线 vs API）未做"

  - id: REQ-A06-001
    check: A-06
    object: 位号
    requirement: "两侧位号集合一致；AddIntoBom/AddIntoPcb/空封装有解释"
    source: "review-method.md A-06"
    conditions: "同上"
    status: explicit
    evidence: "79 对 79，无缺失；H1–H3 等无 MPN 不影响位号一致"
    note: ""

  - id: REQ-A07-001
    check: A-07
    object: U1 / U8 / USB1 / U5,U9,U10
    requirement: "符号引脚号与封装焊盘号按确切 MPN 逐脚对应，重复焊盘号有解释"
    source: "器件手册 + 封装定义"
    conditions: "LQFP48 / SOP-16 / USB-C 16P / SMA"
    status: explicit
    evidence: "U1 48 脚 1:1 映射；U8 16 脚 1:1；USB1 16P+EP4 焊盘；U5/U9/U10 2 脚"
    note: "SS54 引脚号随库定义变化，A 端/C 端需按网表语义判，不按脚号"

  # ---------- B 类：电气连接 ----------
  - id: REQ-B01-001
    check: B-01
    object: U8.7/8/9/10/11/12/15, USB1.A8/B8
    requirement: "未连接脚按手册允许悬空"
    source: "CH340C 手册引述（检索）；USB-C 规范"
    conditions: "TTL 模式，无硬件流控"
    status: explicit
    evidence: "U8.15 R232 悬空 = TTL 模式；7=NC；8/9–12 可悬空；USB1 SBU1/2 不用"
    note: "引述未回查 PDF 原文，标「手册引述（检索）」"

  - id: REQ-B02-001
    check: B-02
    object: 全部网
    requirement: "无单脚网；单脚网需设计意图解释"
    source: "review-method.md B-02"
    conditions: "69 网 / 297 有网引脚"
    status: explicit
    evidence: "0 个单脚网"
    note: ""

  - id: REQ-B03-001
    check: B-03
    object: U1.35 / U1.36 / U1.47 / U1.48
    requirement: "VSS 接 GND，VDD 接 VCC+3.3V"
    source: "STM32F103x8/xB 手册引脚表（DS5319 Table 5，手册引述（检索））"
    conditions: "LQFP48"
    status: explicit
    evidence: "U1.35=VSS_2→VCC+3.3V；U1.36=VDD_2→GND；U1.47=VSS_3→VCC+3.3V；U1.48=VDD_3→GND"
    note: "违反 → F-001 (S0)"

