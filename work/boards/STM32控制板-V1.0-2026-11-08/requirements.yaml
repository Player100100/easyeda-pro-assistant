    check: B-03
    object: U2/U3/U4/U5/U9/U10
    requirement: "稳压器/二极管电源脚接预期轨，电压档正确"
    source: "LM2596 / AMS1117 / XL1509 / SS54 手册引述（检索）"
    conditions: "标称输入"
    status: explicit
    evidence: "U2.1=12V, U2.4=USB+5V；U3.3=5V, U3.2/4=3.3V；U4.1=24V, U4.3=12V；U5.1=24V, U5.2=输入"
    note: "U9/U10 输出方向 → F-003"

  - id: REQ-B04-001
    check: B-04
    object: U2.4 / U3.2+U3.4 / U8 D+/D−
    requirement: "同网多驱动被允许；输出端并联需均流/ORing"
    source: "器件手册"
    conditions: "稳态"
    status: inferred
    evidence: "U2.4 反馈与 U3 输出并联属正常；USB+5V 与 VBUS 直连 → F-004"
    note: ""

  - id: REQ-B05-001
    check: B-05
    object: U1.44 BOOT0 / U1.20 BOOT1 / U4.4 / U2.5
    requirement: "需确定电平的输入有有效驱动或偏置"
    source: "STM32F103 手册；XL1509/LM2596 手册引述（检索）"
    conditions: "上电/复位"
    status: explicit
    evidence: "U4.4 EN=GND（低有效，正确）；U2.5 ON/OFF=GND（低=开，正确）；BOOT0 仅经 R11 到 H1.3，BOOT1 经 R12 到 H1.4"
    note: "BOOT 脚无常态下拉 → F-009"

  - id: REQ-B06-001
    check: B-06
